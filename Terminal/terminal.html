<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal</title>
    <link rel="stylesheet" href="style.css">
    <script type="text/javascript" src="terminal.js"></script>
    <script src="https://kit.fontawesome.com/43314f8f7d.js" crossorigin="anonymous"></script>

</head>
<body>
    <div class="container">
        <div class="map">
            <div class="title"><h1 class="titletext">World View</h1></div>
            <div class="projectcontainer">
                <div class="linecontainer" id="linecontainer">
                    <svg class="linesvg" id="linesvg" width="100%" height="100%"></svg>
                </div>
                <div class="projects">
                    <div class="project" id="project1"></div>
                    <div class="project" id="project2"></div>

                </div>
            </div>
            <div class="route"><h1 class="routetext" id="routetext">Route: </h1></div>
        </div>

        <div class="searchpanel">
            <h1 class="searchbartitle">Search for projects</h1>
            <div class = "searchbarcontainer">
                <textarea class="searchbar"></textarea>
                <i class="fa-solid fa-magnifying-glass" id="searchicon"></i>
                
            </div>
            <ul class="searchresults">

            </ul>
            <button class="setroute" onclick='drawLineBetweenDivs(document.getElementById("project1"), document.getElementById("project2"));'>Chart Route</button>
            <button class="quicktravel">Quick Travel</button>
        </div>
    </div>
</body>
</html>
